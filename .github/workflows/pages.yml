name: Deploy site to GitHub Pages

# Publishes docs/ — the reference page — as a real website.
# configure-pages turns Pages on the first time it runs, so this needs no
# manual toggle in repo settings.

on:
  push:
    branches: ["claude/artist-website-dev-s92irf"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # A phone keeps an old stylesheet or script after a change (the artist kept seeing
      # buttons already taken off, 7 Oct 2026): every local .css and .js the pages load is
      # asked for with this commit's id, so a new deploy is always fetched fresh.
      - name: Stamp the pages' own files with this commit
        run: |
          V=${GITHUB_SHA::8}
          for f in docs/v2/index.html; do
            [ -f "$f" ] && sed -i -E "s#((href|src)=\"[a-z0-9._/-]+\.(css|js))\"#\1?v=$V\"#g" "$f"
          done
          grep -c "?v=$V" docs/v2/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
