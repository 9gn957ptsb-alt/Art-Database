name: Deploy site to GitHub Pages

# Publishes docs/ — the reference page — as a real website.
# configure-pages turns Pages on the first time it runs, so this needs no
# manual toggle in repo settings.

on:
  push:
    branches: ["claude/artist-website-dev-s92irf"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # The buildings' 3D view needs a Google Maps browser key. It lives in the
      # repository secret GOOGLE_MAPS_KEY and is written into the published
      # page only; the repository copy of maps-key.js stays empty.
      - name: Write the Google Maps key
        env:
          MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
        run: |
          if [ -n "$MAPS_KEY" ]; then
            printf 'window.MAPS_KEY = "%s";\n' "$MAPS_KEY" > docs/v2/maps-key.js
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
