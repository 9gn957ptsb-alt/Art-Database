<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Worlds</title>
  <meta name="description" content="A wager game on the Artist Website's globe. The solar system as it stands today; Earth and Mars, and no boundary between worlds.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-at="system">
  <main class="stage" id="stage" aria-label="The solar system. Press the Earth or Mars to go down to it. Down at a world, drag to turn it, scroll or pinch to come nearer, press a territory to choose it; Escape goes back up.">
    <canvas class="layer" id="sky" aria-hidden="true"></canvas>
    <canvas class="layer" id="bodies" aria-hidden="true"></canvas>
    <canvas class="layer" id="marks" aria-hidden="true"></canvas>

    <header class="where">
      <p class="name" id="where-name">Worlds</p>
      <p class="at" id="where-at"></p>
      <p class="purse"><span id="purse">300 marks</span> <span class="income" id="income"></span></p>
      <p class="turn" id="turn">Month 1</p>
    </header>

    <aside class="card" id="card" aria-live="polite" hidden></aside>

    <section class="ledger" aria-label="Houses and chronicle">
      <ul class="houses" id="houses"></ul>
      <details class="chronicle">
        <summary>Chronicle</summary>
        <ol id="log"></ol>
      </details>
      <button class="quiet" id="new">New game</button>
    </section>

    <div class="foot">
      <button class="pill solo" id="end" hidden>End turn</button>
      <nav class="filter" aria-label="Where you are">
        <button class="pill" data-world="system" aria-pressed="true">Solar system</button>
        <button class="pill" data-world="earth" aria-pressed="false">Earth</button>
        <button class="pill" data-world="mars" aria-pressed="false">Mars</button>
        <button class="pill" data-world="city" id="pill-city" aria-pressed="true" hidden></button>
      </nav>
    </div>

    <div class="zoom">
      <button class="pill round" id="zin" aria-label="Nearer">+</button>
      <button class="pill round" id="zout" aria-label="Farther">−</button>
    </div>

    <p class="help" id="street-help" hidden>Arrows or W A S D walk · drag to look · press the ground to walk there · Shift strides · Escape rises</p>
    <p class="near" id="near" hidden></p>
    <p class="going" id="going" hidden></p>
    <p class="banner" id="banner" hidden></p>
    <div class="tip" id="tip" hidden></div>
    <div class="toast" id="toast" role="status"></div>
    <div class="loading" id="loading">Setting out the worlds</div>
  </main>

  <script src="../v2/earth-body.js"></script>
  <script src="../v2/models.js"></script>
  <script src="body.js"></script>
  <script src="street.js"></script>
  <script src="escape.js"></script>
  <script src="game.js"></script>
  <script src="app.js"></script>
</body>
</html>
