<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Holographic Mr Pearl: Pickleball</title>
<meta name="description" content="Holographic Mr Pearl: Pickleball. A pickleball game drawn entirely in characters: Mr Pearl, his guitar for a racket, against his nemesis Mr Plan, court after court without end. How many can you win?">
<link rel="stylesheet" href="pickleball.css">
<script src="../rocket/pearl.js"></script>
<script src="pickleball.js"></script>
</head>
<body>
<canvas id="view" aria-label="The courts at night: one pickleball court to begin, Mr Pearl in front of it. Walk onto it to play Mr Plan; win, and the next court appears beside it, harder."></canvas>
<canvas id="hud" aria-hidden="true"></canvas>
<div class="top"><div id="where" role="status">The courts</div></div>
<div id="loading" role="status">Loading the courts…</div>
<div id="say" role="log" aria-live="polite"></div>
<div id="help" role="status" aria-live="polite" hidden></div>
<button id="super" type="button" aria-pressed="false" aria-label="Super return: once a game, wins the point">◆ Super</button>
</body>
</html>
