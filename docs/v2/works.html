<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matthew Livingston</title>
<!-- The works used to be a page of their own. The Artist Website is one page
     now, and the collages are a side of it: ./#collages lays them all out
     over the world, and ./#<slug> goes down into the city a collage is in.
     This keeps a link to works.html that was already shared working. -->
<link rel="canonical" href="./#collages">
<meta http-equiv="refresh" content="0; url=./#collages">
<script>
  var slug = location.hash.slice(1);
  location.replace("./" + location.search + (slug ? "#" + slug : "#collages"));
</script>
</head>
<body>
<p><a href="./#collages">Matthew Livingston — collages</a></p>
</body>
</html>
