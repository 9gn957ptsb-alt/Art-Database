<title>DIRT Poetry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,500;1,300&display=swap">
<style>
/* Layout: one painted plane, edge to edge, that the viewer drags through; a single quiet label in the
   pages' own type names the page underfoot. One look (watercolour paper), so one palette. */
:root {
  color-scheme: light;
  --paper: #f4efe4;          /* DIRT's paper: 0.957, 0.937, 0.894 */
  --ink: #3a3833;            /* the pages' text */
  --muted: #7d776c;
  --veil: rgba(244, 239, 228, 0.78);
  --face: "Poppins", "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}
html, body { height: 100%; background: var(--paper); color: var(--ink); }
body { margin: 0; overflow: hidden; overscroll-behavior: none; font-family: var(--face); font-weight: 300; }
#plane { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; outline: none; }
#plane.held { cursor: grabbing; }
#plane:focus-visible { box-shadow: inset 0 0 0 2px var(--muted); }
.label {
  position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: calc(100% - 32px);
  padding: 7px 11px 8px; background: var(--veil); border-radius: 3px; pointer-events: none;
  transition: opacity 0.6s ease;
}
.label .t { font-weight: 500; font-size: 12px; letter-spacing: 0.32em; text-transform: uppercase; }
.label .s { font-style: italic; font-size: 12px; color: var(--muted); margin-top: 2px; letter-spacing: 0.01em; }
.hint {
  position: fixed; right: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); padding: 7px 11px 8px;
  background: var(--veil); border-radius: 3px; font-size: 12px; font-style: italic; color: var(--muted);
  pointer-events: none; transition: opacity 0.8s ease;
}
.hint.gone, .label.gone { opacity: 0; }
.fallback { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; font-size: 14px; color: var(--muted); }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
@media (prefers-reduced-motion: reduce) { .label, .hint { transition: none; } }
</style>

<canvas id="plane" tabindex="0" role="img" aria-label="A painted plane on which the five pages of Picture Poetry lie whole, each painted in DIRT: drag, swipe or use the arrow keys to wander from page to page."></canvas>
<div class="label gone" id="label" aria-live="polite"><div class="t" id="label-t"></div><div class="s" id="label-s"></div></div>
<div class="hint" id="hint">Drag to wander</div>
<div class="fallback" id="fallback" hidden>This plane needs WebGL 2, which this browser has turned off.</div>
<section class="sr-only" aria-label="The poems">__POEMS_HTML__</section>

<script>
"use strict";
/* DIRT Poetry: the five pages of Picture Poetry, each laid whole on a plane painted in DIRT.

   The plane is cut into territories, one to each 1597-pixel square, scattered a little, their edges wandering. In
   the middle of each lies one page, whole and as Picture Poetry sets it: its photograph, its poem, its buildings and
   its characters, the pages a little larger than the book shows them (a page pixel is phi^-1 of a plane pixel). The
   five pages are dealt so that no two neighbours are the same page. Each page is painted in one of the four ways the
   stills from DRIFT show, leaning to one and visiting the others:
   after the first, a pale wash with white clouds, the photograph printed in halftone, fine rainbow arcs round a soft
   dark disc, and stipple; after the second, a white ground with one large colour field, grey vapour and upright
   strokes, the photograph coming apart cell by cell at its edges; after the third, a cream ground and a deep band,
   the photograph held in a white cloud, and white clouds holding golden kaleidoscopes; after the fourth, a collage of
   torn pieces, the photograph torn and laid again, the poem on its own torn sheet.
   The page's paper dissolves into the ground; the poem keeps a calm paper under it, so it can be read. Then DIRT's
   watercolour over the paint (the colours bleed, the pigment pools and gathers at the rims of the washes, the paper
   shows through) and, last, the pages' own type, rules, buildings and characters, sharp, as printed on the paint.
   Nothing moves unless it is dragged. */
const ASSETS = __ASSETS__;

const canvas = document.getElementById("plane");
const gl = canvas.getContext("webgl2", { antialias: false, alpha: false, preserveDrawingBuffer: false });
if (!gl) { document.getElementById("fallback").hidden = false; document.getElementById("hint").hidden = true; throw new Error("no WebGL 2"); }

// ---- the shaders ------------------------------------------------------------------------------------------------
const COMMON = `
precision highp float; precision highp int; precision highp sampler2DArray;
const float PHI = 1.618033988749895, P1 = 0.618033988749895, P2 = 0.381966011250105, P3 = 0.236067977499790,
            P4 = 0.145898033750315, P5 = 0.090169943749474;
const float G = 1597.0;            // a page and its ground to each square this wide
const float S = P1;                // plane pixels to a page pixel
uniform vec4 uPageA[5];            // each page: its width and height (page pixels), and whether it, and its photograph,
                                   // lie on their sides in the textures
uniform vec4 uPhotoR[5];           // each page: where it sets its photograph (page pixels: left, top, right, bottom)
uniform vec4 uTextR[5];            // each page: where it sets its poem
uint mixh(uint h) { h ^= h >> 16; h *= 0x7feb352du; h ^= h >> 15; h *= 0x846ca68bu; h ^= h >> 16; return h; }
uint h3(int x, int y, uint s) { return mixh(uint(x) * 0x27d4eb2du ^ mixh(uint(y) * 0x165667b1u + s)); }
float unit(uint h) { return float(h >> 8) * (1.0 / 16777216.0); }
float vnoise(vec2 p, float g, uint s) {
  vec2 f = p / g, i = floor(f), t = f - i; t = t * t * (3.0 - 2.0 * t);
  ivec2 q = ivec2(i);
  return mix(mix(unit(h3(q.x, q.y, s)), unit(h3(q.x + 1, q.y, s)), t.x), mix(unit(h3(q.x, q.y + 1, s)), unit(h3(q.x + 1, q.y + 1, s)), t.x), t.y);
}
float fbm(vec2 p, float g, uint s) { return 0.5 * vnoise(p, g, s) + 0.3 * vnoise(p, g * P1, s + 1u) + 0.2 * vnoise(p, g * P2, s + 2u); }
mat2 turn(float a) { float c = cos(a), s = sin(a); return mat2(c, s, -s, c); }
float sdBox(vec2 p, vec2 b) { vec2 d = abs(p) - b; return length(max(d, 0.0)) + min(max(d.x, d.y), 0.0); }
/** A territory's middle, where its page lies: its square's, moved a little by its own hash. */
vec2 seedOf(ivec2 c, out uint h) {
  h = h3(c.x, c.y, 53u);
  return (vec2(c) + 0.5 + P4 * (vec2(unit(mixh(h + 1u)), unit(mixh(h + 2u))) - 0.5)) * G;
}
/** Which page a territory holds: dealt along the rows two apart, so no two neighbours hold the same page. */
int pageOf(ivec2 c) { int v = c.x + 2 * c.y; return v - 5 * int(floor(float(v) / 5.0)); }
/** Which still a page is painted after here. Each page leans to one (Boiling to the field and its vapour, the
 *  sun in the trees to the kaleidoscope, For What and the lawn to the collage, the lighthouse to the arcs and the
 *  disc) and visits the other three. */
int modeOf(int pg, uint h) {
  int lean = pg == 0 ? 1 : pg == 1 ? 2 : pg == 4 ? 0 : 3;
  float u = unit(mixh(h + 11u));
  if (u < P2) return lean;
  int k = lean + 1 + int(min(2.0, floor((u - P2) / P1 * 3.0)));
  return k > 3 ? k - 4 : k;
}
float tilt(uint h) { return 0.0557 * (unit(mixh(h + 9u)) - 0.5); }   // as laid by hand: within a degree and a half
/** The plane at p, in a territory's page pixels (its page from (0, 0) to its width and height). */
vec2 toPage(vec2 p, vec2 C, uint h, int pg) { return turn(-tilt(h)) * (p - C) / S + 0.5 * uPageA[pg].xy; }
struct Reg { vec2 c1, c2; uint h1, h2; ivec2 k1, k2; float d; };
/** The territory a point is in, and the next one, and how far in from the edge between them it lies. */
Reg regionAt(vec2 p) {
  vec2 pw = p + 377.0 * (vec2(vnoise(p, 987.0, 56u), vnoise(p, 987.0, 57u)) - 0.5)
             + 144.0 * (vec2(vnoise(p, 377.0, 51u), vnoise(p, 377.0, 52u)) - 0.5)
             + 34.0 * (vec2(vnoise(p, 89.0, 54u), vnoise(p, 89.0, 55u)) - 0.5);   // the edges wander, as a wash's do
  ivec2 g0 = ivec2(floor(pw / G));
  Reg r = Reg(vec2(0.0), vec2(1e6), 0u, 0u, ivec2(0), ivec2(0), 0.0);
  float d1 = 1e18, d2 = 1e18;
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
    ivec2 c = g0 + ivec2(i, j);
    uint h; vec2 C = seedOf(c, h);
    float dd = dot(pw - C, pw - C);
    if (dd < d1) { d2 = d1; r.c2 = r.c1; r.h2 = r.h1; r.k2 = r.k1; d1 = dd; r.c1 = C; r.h1 = h; r.k1 = c; }
    else if (dd < d2) { d2 = dd; r.c2 = C; r.h2 = h; r.k2 = c; }
  }
  r.d = (d2 - d1) / (2.0 * max(length(r.c1 - r.c2), 1.0));
  return r;
}
struct Pg { vec2 q; int pg; uint h; float e; };
/** The page nearest p: where p falls on it (page pixels), which page, its territory's hash, and how far outside
 *  its edge p lies (negative within). Pages lie apart, so a page is never cut by its territory's edge. */
Pg pageAt(vec2 p) {
  ivec2 g0 = ivec2(floor(p / G));
  Pg best = Pg(vec2(0.0), 0, 0u, 1e9);
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
    ivec2 c = g0 + ivec2(i, j);
    uint h; vec2 C = seedOf(c, h);
    int pg = pageOf(c);
    vec2 q = toPage(p, C, h, pg), hw = 0.5 * uPageA[pg].xy;
    float e = sdBox(q - hw, hw);
    if (e < best.e) best = Pg(q, pg, h, e);
  }
  return best;
}
`;

const VS = `#version 300 es
void main() { vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2); gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0); }`;

// The paint, a texel to every two pixels of the screen (or coarser while it moves, if moving frames come slowly).
const PAINT = `#version 300 es
${COMMON}
uniform sampler2DArray uPhoto;     // the five photographs, as the pages hold them, mipmapped
uniform vec3 uPal[35];             // each page: paper, light, mid, deep, accent, pastel, pastel
uniform vec3 uPaper[5];            // each page's own paper
uniform vec4 uBlock[5];            // a block of colour a page sets (page 4's sage), or none
uniform vec3 uBlockC[5];
uniform vec2 uOrigin;              // the plane at the screen's top left
uniform float uCell;               // plane pixels a texel
uniform vec2 uSize;                // texels
out vec4 outC;
vec3 pal(int pg, int i) { return uPal[pg * 7 + i]; }
float lum(vec3 c) { return dot(c, vec3(0.3, 0.59, 0.11)) / 255.0; }
const vec3 WHITE = vec3(248.0, 246.0, 241.0), FIBRE = vec3(252.0, 251.0, 247.0);

/** The photograph at f, 0 to 1 across it as the page holds it. */
vec3 photo(int pg, vec2 f, float lod) {
  f = clamp(f, 0.0, 1.0);
  if (uPageA[pg].w > 0.5) f = vec2(1.0 - f.y, f.x);
  return textureLod(uPhoto, vec3(f, float(pg)), lod).rgb * 255.0;
}
vec2 photoF(int pg, vec2 q) { vec4 R = uPhotoR[pg]; return (q - R.xy) / (R.zw - R.xy); }
vec2 mirrored(vec2 uv) { return 1.0 - abs(1.0 - mod(uv, 2.0)); }
/** The photograph laid wide over its territory, met by its mirror image so it has no edge (q from the page's middle). */
vec3 spread(int pg, vec2 q, uint h, float lod) {
  float sc = 1.0 / (1230.0 + 841.0 * unit(mixh(h + 3u)));
  vec2 uv = vec2(0.5) + turn(6.2832 * unit(mixh(h + 4u))) * q * sc + 0.5 * (vec2(unit(mixh(h + 5u)), unit(mixh(h + 6u))) - 0.5);
  return photo(pg, mirrored(uv), lod);
}
/** The photograph thinned with water until only its light is left: the territory's wash. */
vec3 washAt(int pg, vec2 q, uint h) {
  vec3 c = spread(pg, q, h, 6.2);
  float l = max(lum(c), 0.05);
  c *= mix(1.0, 0.82 / l, 0.55);                                     // its darks lifted: a wash is never deep
  return mix(pal(pg, 0), c, 0.3 + 0.08 * vnoise(q, 377.0, h + 15u));
}
/** Where still 1's disc sits: just beyond the photograph's far edge, away from the poem, never far off the page
 *  (page pixels from the page's corner). */
vec2 discAt(vec2 rc, vec2 rh, vec2 away, float rd, vec2 hw) {
  float reach = abs(away.x) * rh.x + abs(away.y) * rh.y;
  return clamp(rc + away * (reach + 0.5 * rd), vec2(-89.0), 2.0 * hw + 89.0);
}
/** A point out in the territory's ground, beside its page (q from the page's middle, page pixels). */
vec2 beside(vec2 hw, float a, float far) {
  vec2 d = vec2(cos(a), sin(a));
  float edge = min(hw.x / max(abs(d.x), 1e-3), hw.y / max(abs(d.y), 1e-3));
  return d * (edge + far);
}

// ---- the devices of the four stills (page pixels; q from the page's middle unless said) ------------------------
vec3 clouds(vec3 col, vec2 q, uint h) {
  vec2 o = 1616.0 * vec2(unit(mixh(h + 20u)), unit(mixh(h + 21u)));
  float c = smoothstep(0.54, 0.7, fbm(q + o, 275.0, h + 22u));
  float under = smoothstep(0.54, 0.7, fbm(q + o + vec2(0.0, -18.0), 275.0, h + 22u));
  col = mix(col, col * 0.88, clamp(under - c, 0.0, 1.0) * 0.6);     // their grey undersides
  return mix(col, WHITE, c * 0.88);
}
/** Fine arcs in rainbow colours round a centre, a rainbow drawn in hairlines (still 1). */
vec3 arcs(vec3 col, vec2 q, vec2 ca, float R, uint h, float amt) {
  vec2 d = q - ca;
  float r = length(d);
  float band = smoothstep(R - 340.0, R - 146.0, r) * (1.0 - smoothstep(R + 146.0, R + 372.0, r));
  float s = fract(r / 14.6), line = exp(-pow((s - 0.5) / 0.16, 2.0));
  vec3 hue = 255.0 * (0.66 + 0.3 * cos(6.2832 * (r / 610.0 + unit(h) + vec3(0.0, 0.33, 0.67))));
  return mix(col, hue * 0.88, band * line * amt);
}
/** A soft dark disc, as the sun leaves on the eye (still 1). */
vec3 disc(vec3 col, vec2 q, vec2 cd, float rd, uint h) {
  float e = length(q - cd) + 11.0 * (vnoise(q, 34.0, h + 37u) - 0.5);
  float a = 1.0 - smoothstep(rd - 16.0, rd + 16.0, e);
  return mix(col, vec3(62.0, 58.0, 55.0) * (0.86 + 0.28 * vnoise(q, 21.0, h + 38u)), a * 0.94);
}
/** The photograph screened into dots of one ink, in a soft patch (stills 1 and 3). */
vec3 halftone(vec3 col, vec2 q, vec2 ch, int pg, uint h, vec3 ink, float period, float amt) {
  vec2 e = (q - ch) / vec2(291.0, 186.0);
  float mask = 1.0 - smoothstep(0.55, 1.0, length(e) + 0.3 * (vnoise(q, 55.0, h + 42u) - 0.5));
  if (mask <= 0.0) return col;
  mat2 t = turn(0.785398);
  vec2 g = t * q / period, cell = floor(g) + 0.5, f = g - cell;
  vec3 c = spread(pg, transpose(t) * cell * period, h, 2.0);
  float rr = 0.5 * sqrt(clamp((1.0 - lum(c)) * 1.35, 0.0, 1.0));
  float dt = 1.0 - smoothstep(rr - 0.08, rr + 0.08, length(f));
  return mix(col, ink, dt * mask * amt);
}
/** Small clusters of pen stipple (stills 1 and 2): as ash, or sigils. */
vec3 stipple(vec3 col, vec2 q, uint h) {
  vec2 cc = floor(q / 233.0);
  uint hc = h3(int(cc.x), int(cc.y), h + 50u);
  if (unit(hc) > 0.17) return col;
  vec2 C = (cc + 0.25 + 0.5 * vec2(unit(mixh(hc + 1u)), unit(mixh(hc + 2u)))) * 233.0;
  float r = length(q - C);
  if (r > 31.0) return col;
  vec2 sg = floor(q / 5.0);
  uint hs = h3(int(sg.x), int(sg.y), hc);
  if (unit(hs) > 0.6 * (1.0 - r / 31.0)) return col;
  vec2 dc = (sg + 0.5 + 0.5 * (vec2(unit(mixh(hs + 1u)), unit(mixh(hs + 2u))) - 0.5)) * 5.0;
  return mix(col, vec3(36.0, 34.0, 32.0), (1.0 - smoothstep(0.9, 1.9, length(q - dc))) * 0.85);
}
/** Grey vapour, soft as smoke (still 2): the boiling. */
vec3 vapour(vec3 col, vec2 q, uint h) {
  float f = fbm(q + 1133.0 * vec2(unit(mixh(h + 60u))), 307.0, h + 61u);
  return mix(col, vec3(120.0, 114.0, 112.0), smoothstep(0.5, 0.8, f) * 0.5);
}
/** Pigment settling as watercolour does, in soft granules with no grain of their own (turned off the grid). */
float settle(vec2 q, uint h) { return 0.92 + 0.16 * fbm(turn(0.6) * q, 55.0, h); }
/** One large colour field, its rim a gentle curve, its pigment granulated as watercolour settles (stills 2 and 3). */
vec3 field(vec3 col, vec2 q, vec2 cf, float R, uint h, vec3 c) {
  float e = length(q - cf) - R + 24.0 * (vnoise(q, 55.0, h + 73u) - 0.5);
  return mix(col, c * settle(q, h + 74u), 1.0 - smoothstep(-15.0, 15.0, e));
}
/** A deep band between two gentle curves (still 3). */
vec3 band(vec3 col, vec2 q, vec2 cb, float R, float wd, uint h, vec3 c) {
  float e = abs(length(q - cb) - R) - wd + 23.0 * (vnoise(q, 55.0, h + 75u) - 0.5);
  return mix(col, c * settle(q, h + 74u), 1.0 - smoothstep(-13.0, 13.0, e));
}
/** Torn pieces laid over one another, most of them pastels of the page's colours, a few holding a fragment of its
 *  photograph, each upper piece's torn edge white with the paper's fibre and the piece beneath in its shadow (still 4). */
vec3 collage(vec3 col, vec2 q, int pg, uint h, float size, float amt) {
  vec2 qw = q + 34.0 * (vec2(vnoise(q, 55.0, h + 80u), vnoise(q, 55.0, h + 81u)) - 0.5)
              + 10.0 * (vec2(vnoise(q, 11.0, h + 82u), vnoise(q, 11.0, h + 83u)) - 0.5);
  ivec2 g0 = ivec2(floor(qw / size));
  float d1 = 1e18, d2 = 1e18; uint p1 = 0u, p2 = 0u; vec2 s1 = vec2(0.0), s2 = vec2(0.0);
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
    ivec2 c = g0 + ivec2(i, j);
    uint hc = h3(c.x, c.y, h + 84u);
    vec2 S2 = (vec2(c) + 0.5 + 0.8 * (vec2(unit(mixh(hc + 1u)), unit(mixh(hc + 2u))) - 0.5)) * size;
    float dd = dot(qw - S2, qw - S2);
    if (dd < d1) { d2 = d1; p2 = p1; s2 = s1; d1 = dd; p1 = hc; s1 = S2; }
    else if (dd < d2) { d2 = dd; p2 = hc; s2 = S2; }
  }
  float e = 0.5 * (sqrt(d2) - sqrt(d1));                             // in from the edge between the two, on p1's side
  bool firstOnTop = unit(mixh(p1 + 5u)) > unit(mixh(p2 + 5u));
  float se = firstOnTop ? e : -e;                                    // in from the edge, on the upper piece's side
  float ov = 8.0 + 6.0 * vnoise(q, 8.0, h + 85u);                    // how far the upper piece reaches over
  bool onTop = se > -ov;
  uint pc = onTop == firstOnTop ? p1 : p2;
  vec2 sc = onTop == firstOnTop ? s1 : s2;
  vec3 pa = pal(pg, 5), pb = pal(pg, 6);
  if (unit(mixh(pc + 8u)) < 0.5) { vec3 t = pa; pa = pb; pb = t; }
  vec3 frag = mix(pa, pb, smoothstep(-194.0, 194.0, dot(q - sc, turn(6.2832 * unit(mixh(pc + 9u))) * vec2(1.0, 0.0))));
  if (unit(mixh(pc + 10u)) < P2) frag = mix(mix(spread(pg, q + 610.0 * vec2(unit(mixh(pc + 1u)), unit(mixh(pc + 2u))), pc, 0.6), WHITE, 0.22), frag, 0.46);
  frag = mix(frag, WHITE, 0.26 * smoothstep(-146.0, 146.0, dot(q - sc, vec2(0.7071, -0.7071))));   // light across it
  float rim = onTop ? smoothstep(-ov, -ov + 1.6, se) * (1.0 - smoothstep(-ov + 2.6, -ov + 5.8 + 3.2 * vnoise(q, 5.0, h + 86u), se)) : 0.0;
  frag = mix(frag, FIBRE * (0.95 + 0.05 * vnoise(q, 2.4, h + 87u)), rim);
  if (!onTop) frag *= 1.0 - 0.11 * (1.0 - smoothstep(0.0, 13.0, -ov - se));   // in the upper piece's shadow
  return mix(col, frag, amt);
}
/** Light caught on the paper: thin soft streaks (still 4). */
vec3 glints(vec3 col, vec2 q, vec2 at, uint h) {
  for (int k = 0; k < 4; k++) {
    uint hk = mixh(h + 100u + uint(k) * 3u);
    vec2 c = at + turn(6.2832 * unit(hk)) * vec2(404.0 * unit(mixh(hk + 1u)), 0.0);
    vec2 l = turn(-6.2832 * unit(mixh(hk + 2u))) * (q - c);
    float s = exp(-abs(l.y) / 2.1) * exp(-abs(l.x) / (36.0 + 48.0 * unit(mixh(hk + 3u))));
    s = max(s, 0.6 * exp(-abs(l.x) / 2.1) * exp(-abs(l.y) / 14.6));
    col = mix(col, vec3(253.0, 252.0, 249.0), s * 0.7);
  }
  return col;
}
/** A white cloud, and in it the page's photograph seen in five mirrors standing at 36 degrees: the pentagon's
 *  symmetry, where cos 36 degrees is phi / 2. Two brush strokes lie in the wedge between the mirrors, so ten images
 *  make a star, and the same star again phi^2 smaller in its middle, where the mirrors face each other (still 3). */
vec3 rosette(vec3 col, vec2 q, vec2 ck, float rb, int pg, uint hk) {
  vec2 d = q - ck;
  float r = length(d);
  float edge = r + rb * 0.42 * (vnoise(q, rb * 0.55, hk + 3u) - 0.5) + 8.0 * (vnoise(q, 5.0, hk + 4u) - 0.5);   // a cloud's outline
  float blob = 1.0 - smoothstep(rb * 1.3, rb * 1.3 + 21.0, edge);
  if (blob <= 0.0) return col;
  float w = 3.14159265 / 5.0, a = atan(d.y, d.x) + 6.2832 * unit(mixh(hk + 5u));
  float i = floor(a / w), f = a - i * w;
  if (mod(i, 2.0) > 0.5) f = w - f;                                  // every other image the mirror image
  vec3 star = WHITE;
  for (int lv = 0; lv < 2; lv++) {
    float rr = r * (lv == 0 ? 1.0 : PHI * PHI), fade = lv == 0 ? 1.0 : P1;
    vec2 wq = rr * vec2(cos(f), sin(f));
    for (int sk = 0; sk < 2; sk++) {
      float sa = (sk == 0 ? 0.25 : 0.72) * w + 0.12 * w * (unit(mixh(hk + 20u + uint(sk))) - 0.5);
      vec2 dir = vec2(cos(sa), sin(sa));
      float r0 = rb * (sk == 0 ? 0.22 : 0.48), r1 = rb * (sk == 0 ? 0.78 : 1.02);
      float t = clamp(dot(wq, dir), r0, r1), dist = length(wq - dir * t);
      float wd = (sk == 0 ? 10.5 : 7.3) * (1.0 - 0.45 * smoothstep(r0, r1, t));   // thinning dry toward its end
      float s = 1.0 - smoothstep(wd - 2.4, wd + 2.4, dist + 3.2 * (vnoise(wq, 5.0, hk + 9u) - 0.5));
      // its colour from the photograph: where it was dark, dark; else the page's accent
      vec3 src = photo(pg, 0.15 + 0.7 * vec2(unit(mixh(hk + 30u + uint(sk))), unit(mixh(hk + 32u + uint(sk)))), 2.0);
      vec3 ink = lum(src) < 0.42 ? vec3(44.0, 41.0, 42.0) : pal(pg, 4);
      star = mix(star, ink, s * fade * (0.78 + 0.22 * vnoise(wq, 8.0, hk + 11u)));
    }
  }
  return mix(col, star, blob);
}
/** A soft stroke of a loaded brush, thinning dry at its ends (stills 2 and 3). */
vec3 stroke(vec3 col, vec2 q, vec2 c, float a, float len, float wd, vec3 ink, uint hk) {
  vec2 l = turn(-a) * (q - c);
  float e = length(vec2(max(abs(l.x) - len, 0.0), l.y)) - wd * (1.0 - 0.35 * smoothstep(0.4, 1.0, abs(l.x) / len))
            + 5.0 * (vnoise(q, 6.5, hk + 5u) - 0.5);
  float s = (1.0 - smoothstep(-3.2, 4.0, e)) * (0.72 + 0.28 * vnoise(l, 8.0, hk + 7u));
  return mix(col, ink, s);
}
/** A short woven band of chevrons in the page's colours, gently bowed, as a strip of cloth lies (still 2). */
vec3 woven(vec3 col, vec2 q, float y, float x0, float x1, int pg) {
  float dy = q.y - y - 0.00021 * (q.x - 0.5 * (x0 + x1)) * (q.x - 0.5 * (x0 + x1));
  float b = (1.0 - smoothstep(16.0, 22.0, abs(dy))) * smoothstep(x0, x0 + 113.0, q.x) * (1.0 - smoothstep(x1 - 113.0, x1, q.x));
  if (b <= 0.0) return col;
  int k = int(fract((q.x + abs(dy) * 1.4) / 26.0) * 3.0);
  return mix(col, k == 0 ? pal(pg, 3) : k == 1 ? pal(pg, 4) : pal(pg, 1), b * 0.85);
}
/** A knot of torn photograph out in the white, its edge dissolving cell by cell (still 2). */
vec3 knot(vec3 col, vec2 q, vec2 ck, int pg, uint h) {
  float m = 1.0 - smoothstep(0.55, 1.0, length((q - ck) / vec2(275.0, 210.0)) + 0.35 * (fbm(q, 89.0, h + 132u) - 0.5));
  if (m <= 0.0) return col;
  vec2 cell = floor(q / 5.0);
  if (unit(h3(int(cell.x), int(cell.y), h + 133u)) > m * 1.25) return col;
  return collage(col, q, pg, h + 134u, 121.0, 0.85);
}

// ---- the page's photograph, after each still (q in page pixels) ------------------------------------------------
/** Printed in halftone over a pale wash of itself: dots where it is dark, in its own colours leaning to the
 *  page's accent, at 45 degrees; its lights left to the wash (still 1). */
vec3 photoHalftone(vec3 col, vec2 q, int pg, uint h, float er) {
  float edge = er + 11.0 * (vnoise(q, 21.0, h + 150u) - 0.5) + 4.0 * (vnoise(q, 5.0, h + 151u) - 0.5);
  float inside = 1.0 - smoothstep(-15.0, 0.0, edge);
  if (inside <= 0.0) return col;
  vec3 ph = photo(pg, photoF(pg, q), 1.2);
  vec3 base = mix(mix(ph, vec3(lum(ph) * 255.0), 0.24), uPaper[pg], 0.38);
  mat2 t = turn(0.785398);
  float per = 21.0;
  vec2 g = t * q / per, cell = floor(g) + 0.5, f = g - cell;
  vec3 pc = photo(pg, photoF(pg, transpose(t) * cell * per), 2.4);
  float rr = 0.44 * sqrt(clamp((1.0 - lum(pc) - 0.18) * 1.5, 0.0, 1.0));
  float dt = 1.0 - smoothstep(rr - 0.09, rr + 0.09, length(f));
  vec3 dotc = mix(pc * 0.78, pal(pg, 4), 0.42);
  return mix(col, mix(base, dotc, dt * 0.72), inside);
}
/** Whole in its middle, coming apart cell by cell toward its edge, the cells drifting out (still 2). */
vec3 photoKnot(vec3 col, vec2 q, int pg, uint h, float er, vec2 rh) {
  float bw = 0.26 * min(rh.x, rh.y);                                 // the band where it comes apart
  float inset = -er + 0.55 * bw * (fbm(q, 89.0, h + 152u) - 0.5);
  if (inset < -0.62 * bw) return col;
  if (inset >= bw) return photo(pg, photoF(pg, q), 0.8);
  vec2 cell = floor(q / 13.0);
  uint hc = h3(int(cell.x), int(cell.y), h + 153u);
  float keep = smoothstep(-0.62 * bw, bw, inset);
  if (unit(hc) > keep * keep * 1.1) return col;
  vec2 cc = (cell + 0.5) * 13.0 + 3.0 * (vec2(unit(mixh(hc + 3u)), unit(mixh(hc + 4u))) - 0.5);
  vec2 crumb = vec2(2.6 + 3.4 * unit(mixh(hc + 5u)), 2.6 + 3.4 * unit(mixh(hc + 6u)));
  vec3 c = photo(pg, photoF(pg, cc + 13.0 * (vec2(unit(mixh(hc + 1u)), unit(mixh(hc + 2u))) - 0.5)), 0.6);
  return mix(col, c, 1.0 - smoothstep(-0.5, 1.5, sdBox(q - cc, crumb)));
}
/** Held in a white cloud: its edge a cloud's, thinning to white toward the rim (still 3). */
vec3 photoCloud(vec3 col, vec2 q, int pg, uint h, float er, vec2 rh) {
  float s = min(rh.x, rh.y);
  float e = er + 0.18 * s * (fbm(q, 0.3 * s, h + 154u) - 0.5) + 8.0 * (vnoise(q, 6.5, h + 155u) - 0.5);
  float blob = 1.0 - smoothstep(0.0, 34.0, e);
  if (blob <= 0.0) return col;
  float inside = 1.0 - smoothstep(-55.0, -13.0, e);
  vec3 ph = mix(photo(pg, photoF(pg, q), 0.9), WHITE, 0.1);
  return mix(col, mix(WHITE, ph, inside), blob);
}
/** Torn into pieces and laid again, each a little moved and turned, the torn edges white with fibre (still 4). */
vec3 photoTorn(vec3 col, vec2 q, int pg, uint h, vec2 rc, vec2 rh) {
  float size = 0.95 * min(rh.x, rh.y);
  vec2 qw = q + 34.0 * (vec2(vnoise(q, 55.0, h + 160u), vnoise(q, 55.0, h + 161u)) - 0.5)
              + 10.0 * (vec2(vnoise(q, 11.0, h + 162u), vnoise(q, 11.0, h + 163u)) - 0.5);
  ivec2 g0 = ivec2(floor(qw / size));
  float d1 = 1e18, d2 = 1e18; uint p1 = 0u, p2 = 0u;
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
    ivec2 c = g0 + ivec2(i, j);
    uint hc = h3(c.x, c.y, h + 164u);
    vec2 S2 = (vec2(c) + 0.5 + 0.8 * (vec2(unit(mixh(hc + 1u)), unit(mixh(hc + 2u))) - 0.5)) * size;
    float dd = dot(qw - S2, qw - S2);
    if (dd < d1) { d2 = d1; p2 = p1; d1 = dd; p1 = hc; }
    else if (dd < d2) { d2 = dd; p2 = hc; }
  }
  float e = 0.5 * (sqrt(d2) - sqrt(d1));
  bool firstOnTop = unit(mixh(p1 + 5u)) > unit(mixh(p2 + 5u));
  float se = firstOnTop ? e : -e;
  float ov = 8.0 + 6.0 * vnoise(q, 8.0, h + 165u);
  bool onTop = se > -ov;
  uint pc = onTop == firstOnTop ? p1 : p2;
  vec2 off = 21.0 * (vec2(unit(mixh(pc + 1u)), unit(mixh(pc + 2u))) - 0.5);
  vec2 src = rc + turn(0.035 * (unit(mixh(pc + 3u)) - 0.5)) * (q - rc) - off;
  float tear = sdBox(src - rc, rh) + 11.0 * (vnoise(q, 15.0, h + 166u) - 0.5) + 3.2 * (vnoise(q, 4.0, h + 167u) - 0.5);
  if (tear > 0.0) return col * (1.0 - 0.1 * (1.0 - smoothstep(0.0, 15.0, tear)));   // its soft shadow round it
  vec3 frag = photo(pg, photoF(pg, src), 0.7);
  frag = mix(frag, WHITE, 0.16 * smoothstep(-rh.x, rh.x, dot(q - rc, vec2(0.7071, -0.7071))));   // light across it
  float rimP = onTop ? smoothstep(-ov, -ov + 1.6, se) * (1.0 - smoothstep(-ov + 2.6, -ov + 5.8 + 3.2 * vnoise(q, 5.0, h + 168u), se)) : 0.0;
  float rimE = smoothstep(-5.8 - 3.2 * vnoise(q, 5.0, h + 169u), -1.6, tear);
  frag = mix(frag, FIBRE, max(rimP, rimE) * 0.9);
  if (!onTop) frag *= 1.0 - 0.11 * (1.0 - smoothstep(0.0, 13.0, -ov - se));
  return frag;
}

/** A page laid on its territory, after the still it is painted in. */
vec3 pageLayer(vec3 col, vec2 q, int pg, uint h) {
  int m = modeOf(pg, h);
  vec2 hw = 0.5 * uPageA[pg].xy;
  vec4 R = uPhotoR[pg], T = uTextR[pg];
  vec2 rc = 0.5 * (R.xy + R.zw), rh = 0.5 * (R.zw - R.xy);
  vec2 tc = 0.5 * (T.xy + T.zw), th = 0.5 * (T.zw - T.xy);
  float wob = 55.0 * (fbm(q, 233.0, h + 140u) - 0.5) + 13.0 * (vnoise(q, 34.0, h + 141u) - 0.5);
  float sheet = 1.0 - smoothstep(-144.0, 0.0, sdBox(q - hw, hw) + wob);   // the page's paper, its edge a wash's
  float tz = 1.0 - smoothstep(-89.0, 0.0, sdBox(q - tc, th + 55.0) + 0.6 * wob);   // the calm under the poem
  if (m == 3) {                                                      // the poem on its own torn sheet
    float te = sdBox(q - tc, th + 55.0) + 13.0 * (vnoise(q, 21.0, h + 170u) - 0.5) + 4.0 * (vnoise(q, 5.5, h + 171u) - 0.5);
    if (te < 0.0) {
      vec3 pc = uPaper[pg] * (0.985 + 0.03 * vnoise(q, 3.2, h + 172u));
      col = mix(pc, FIBRE, (1.0 - smoothstep(1.0, 5.8 + 2.4 * vnoise(q, 3.2, h + 173u), -te)) * 0.9);
    } else {
      col *= 1.0 - 0.12 * (1.0 - smoothstep(0.0, 21.0, sdBox(q - tc - vec2(8.0, 11.0), th + 55.0)));
    }
  } else {
    col = mix(col, mix(uPaper[pg], col, 0.15), max(sheet * (m == 0 ? 0.62 : 0.38), tz * 0.92));
  }
  vec4 B = uBlock[pg];                                               // the page's block of colour, as a wash
  if (B.z > B.x) {
    float eb = sdBox(q - 0.5 * (B.xy + B.zw), 0.5 * (B.zw - B.xy)) + 0.5 * wob;
    col = mix(col, mix(uBlockC[pg], col, 0.2), (1.0 - smoothstep(-55.0, 0.0, eb)) * (m == 3 ? 0.5 : 0.8));
  }
  float er = sdBox(q - rc, rh);
  vec2 away = normalize(rc - tc + vec2(1e-3, 0.0));                  // from the poem toward the photograph
  if (m == 0) {
    col = photoHalftone(col, q, pg, h, er);
    // the disc just beyond the photograph's far edge, and the arcs round it, lighter over the page than the ground
    float rd = 0.2 * min(rh.x, rh.y) + 34.0 * unit(mixh(h + 36u));
    vec2 cd = discAt(rc, rh, away, rd, hw);
    col = arcs(col, q, cd, length(rc - cd) * (0.8 + 0.3 * unit(mixh(h + 31u))), h, 0.45 * (1.0 - tz) * sheet);
    col = disc(col, q, cd, rd, h);
  } else if (m == 1) {
    col = photoKnot(col, q, pg, h, er, rh);
    for (int k = 0; k < 3; k++) {                                    // upright strokes across its far edge
      uint hk = mixh(h + 110u + uint(k) * 5u);
      vec2 c = vec2(rc.x + sign(away.x) * rh.x * (0.86 + 0.28 * unit(hk)), rc.y + rh.y * (unit(mixh(hk + 1u)) - 0.5) * 1.2);
      col = stroke(col, q, c, 1.5708 + 0.15 * (unit(mixh(hk + 2u)) - 0.5), 0.12 * rh.y + 0.14 * rh.y * unit(mixh(hk + 3u)),
                   11.0 + 10.0 * unit(mixh(hk + 4u)), unit(mixh(hk + 6u)) < 0.62 ? pal(pg, 4) : vec3(50.0, 47.0, 46.0), hk);
    }
  } else if (m == 2) {
    col = photoCloud(col, q, pg, h, er, rh);
    for (int k = 0; k < 3; k++) {                                    // kaleidoscopes round it, clear of the poem
      uint hk = mixh(h + 90u + uint(k) * 7u);
      float a = 6.2832 * unit(hk);
      vec2 ck = k == 0 ? rc + sign(away) * rh * 0.8 : rc + vec2(cos(a), sin(a)) * rh * (0.9 + 0.3 * unit(mixh(hk + 1u)));
      ck = clamp(ck, vec2(144.0), 2.0 * hw - 144.0);
      float rb = 74.0 + 68.0 * unit(mixh(hk + 2u));
      if (sdBox(ck - tc, th) > rb * 1.5) col = rosette(col, q, ck, rb, pg, hk);
    }
  } else {
    col = photoTorn(col, q, pg, h, rc, rh);
    col = glints(col, q, rc, h);
  }
  return col;
}

/** A territory's ground: its wash, whiter after still 2, creamier after still 3. */
vec3 groundAt(int pg, vec2 q, uint h, int m) {
  vec3 w = washAt(pg, q, h);
  if (m == 1) return mix(w, WHITE, 0.45);
  if (m == 2) return mix(w, mix(pal(pg, 0), vec3(240.0, 230.0, 210.0), 0.5), 0.45);
  return w;
}
/** One territory's ground at p: its wash and the devices of its still round its page. */
vec3 territory(vec2 p, vec2 C, uint h, ivec2 k) {
  int pg = pageOf(k), m = modeOf(pg, h);
  vec2 hw = 0.5 * uPageA[pg].xy, q = toPage(p, C, h, pg) - hw;      // from the page's middle
  vec4 R = uPhotoR[pg], T = uTextR[pg];
  vec2 rc = 0.5 * (R.xy + R.zw) - hw, rh = 0.5 * (R.zw - R.xy), tc = 0.5 * (T.xy + T.zw) - hw;
  vec2 away = normalize(rc - tc + vec2(1e-3, 0.0));
  vec3 col = groundAt(pg, q, h, m);
  float side = 6.2832 * unit(mixh(h + 30u));
  if (m == 0) {                                                      // still 1
    col = clouds(col, q, h);
    if (unit(mixh(h + 12u)) < P1) col = halftone(col, q, beside(hw, side + 3.1416, 233.0), pg, h, pal(pg, 4), 16.0, 0.85);
    float rd = 0.2 * min(rh.x, rh.y) + 34.0 * unit(mixh(h + 36u));
    vec2 cd = discAt(rc + hw, rh, away, rd, hw) - hw;
    col = arcs(col, q, cd, length(rc - cd) * (0.8 + 0.3 * unit(mixh(h + 31u))), h, 0.78);
    col = stipple(col, q, h);
  } else if (m == 1) {                                               // still 2
    float Rf = 0.62 * max(hw.x, hw.y) * 2.0;
    col = field(col, q, rc + away * (Rf * 0.8), Rf, h, pal(pg, 3));
    col = vapour(col, q, h);
    if (unit(mixh(h + 13u)) < P1) col = knot(col, q, beside(hw, side, 280.0), pg, h);
    for (int s = 0; s < 2; s++) {
      uint hs = mixh(h + 115u + uint(s) * 5u);
      col = stroke(col, q, beside(hw, side + 2.4 + 1.4 * float(s), 120.0 + 200.0 * unit(hs)), 1.5708 + 0.15 * (unit(mixh(hs + 2u)) - 0.5),
                   60.0 + 110.0 * unit(mixh(hs + 3u)), 11.0 + 10.0 * unit(mixh(hs + 4u)), unit(mixh(hs + 6u)) < 0.62 ? pal(pg, 4) : vec3(50.0, 47.0, 46.0), hs);
    }
    if (unit(mixh(h + 14u)) < P2) {
      float wc = hw.x * 0.62 * (unit(mixh(h + 16u)) - 0.5), wl = hw.x * (0.38 + 0.24 * unit(mixh(h + 17u)));
      col = woven(col, q, hw.y + 89.0, wc - wl, wc + wl, pg);
    }
    col = stipple(col, q, h);
  } else if (m == 2) {                                               // still 3
    float Rb = 1130.0 + 810.0 * unit(mixh(h + 77u));
    col = band(col, q, rc + away * (Rb + 0.3 * length(rh)) + 0.4 * rh * vec2(-away.y, away.x), Rb, 55.0 + 48.0 * unit(mixh(h + 79u)), h, pal(pg, 3));
    for (int s = 0; s < 2; s++) {
      uint hs = mixh(h + 95u + uint(s) * 7u);
      col = rosette(col, q, beside(hw, side + 3.1416 * float(s) + 0.6 * unit(hs), 160.0 + 120.0 * unit(mixh(hs + 1u))), 74.0 + 68.0 * unit(mixh(hs + 2u)), pg, hs);
    }
    col = halftone(col, q, beside(hw, side + 1.6, 200.0), pg, h, vec3(150.0, 148.0, 146.0), 24.0, 0.6);
  } else {                                                           // still 4
    col = collage(col, q, pg, h, 275.0, 1.0);
    col = glints(col, q, beside(hw, side, 160.0), h);
  }
  return col;
}

void main() {
  vec2 p = uOrigin + vec2(gl_FragCoord.x, uSize.y - gl_FragCoord.y) * uCell;
  Reg r = regionAt(p);
  vec3 col = territory(p, r.c1, r.h1, r.k1);
  if (r.d < 233.0)                                                   // two territories melting into each other
    col = mix(territory(p, r.c2, r.h2, r.k2), col, 0.5 + 0.5 * smoothstep(0.0, 233.0, r.d));
  Pg g = pageAt(p);
  if (g.e < 377.0) col = pageLayer(col, g.q, g.pg, g.h);
  outC = vec4(clamp(col, 0.0, 255.0) / 255.0, 1.0);
}`;

// The screen: DIRT's watercolour over the paint, then the pages' own type, buildings and characters.
const FINAL = `#version 300 es
${COMMON}
uniform sampler2D uPaint;
uniform sampler2DArray uInk;       // each page with its paper taken away: its type, rules, buildings, characters
uniform vec2 uOrigin;
uniform float uDpr;
uniform vec2 uView;                // device pixels
uniform vec2 uPaintSize;
uniform vec2 uPaintScale;          // paint texels a device pixel
out vec4 outColour;
float lum(vec3 c) { return dot(c, vec3(0.3, 0.59, 0.11)); }

void main() {
  vec2 fc = vec2(gl_FragCoord.x, uView.y - gl_FragCoord.y);
  vec2 p = uOrigin + fc / uDpr;
  vec2 tp = gl_FragCoord.xy * uPaintScale, ts = 1.0 / uPaintSize;
  // DIRT's watercolour: the colours bleed into their neighbours, the pigment is denser and thinner over the paper's
  // grain and in slow pools and gathers at the rim of every wash, and the paper shows through it all
  vec3 own = texture(uPaint, tp * ts).rgb, soft = vec3(0.0);
  float sw = 0.0; vec2 gr = vec2(0.0);
  for (int dy = -1; dy <= 1; dy++) for (int dx = -1; dx <= 1; dx++) {
    vec2 o = vec2(dx, dy) * 1.5;
    vec3 kk = texture(uPaint, (tp + o) * ts).rgb;
    float w = exp(-dot(o, o) / 2.618);
    soft += w * kk; sw += w;
    gr += vec2(dx, dy) * lum(kk);
  }
  soft /= sw;
  vec3 c = mix(own, soft, 0.62);
  float edge = smoothstep(0.06, 0.5, length(gr) / 3.0);
  float grain = vnoise(p, 1.2, 7u) * 0.6 + vnoise(p, 3.0, 8u) * 0.4;
  float pool = vnoise(p, 89.0, 9u) * 0.62 + vnoise(p, 34.0, 10u) * 0.38;
  float dd = 1.0 + 0.34 * (grain - 0.5) + 0.5 * (pool - 0.5) + 0.236 * edge;
  c = clamp(c - (c - c * c) * (dd - 1.0), 0.0, 1.0);
  vec3 paper = vec3(0.957, 0.937, 0.894) * (0.985 + 0.03 * grain);
  c = mix(c, paper, 0.06);
  // the page's type, rules, buildings and characters, printed on the paint
  Pg g = pageAt(p);
  if (g.e < 0.0) {
    vec2 wh = uPageA[g.pg].xy;
    vec2 uv = uPageA[g.pg].z > 0.5 ? vec2(1.0 - g.q.y / wh.y, g.q.x / wh.x) : g.q / wh;
    vec4 ink = texture(uInk, vec3(uv, float(g.pg)));                 // premultiplied
    float k = 0.94 * (0.95 + 0.05 * grain);
    c = c * (1.0 - ink.a * k) + ink.rgb * k;
  }
  c = mix(c, c * (0.97 + 0.06 * grain), 0.5);                        // the paper's tooth through it all
  // toward the margins the paint thins to paper and cool air, so the picture has no frame
  vec2 r = (gl_FragCoord.xy - 0.5 * uView) / (0.5 * uView);
  float far = smoothstep(0.62, 1.5, length(r * vec2(1.0, 0.8)) + 0.12 * (pool - 0.5));
  c = mix(c, mix(paper, vec3(0.86, 0.9, 0.95), 0.35), far * 0.55);
  outColour = vec4(c, 1.0);
}`;

function compile(src, type) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s) || "shader");
  return s;
}
function program(fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(VS, gl.VERTEX_SHADER)); gl.attachShader(p, compile(fs, gl.FRAGMENT_SHADER));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p) || "link");
  const u = {}, n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const a = gl.getActiveUniform(p, i), name = a.name.replace(/\[0\]$/, ""); u[name] = gl.getUniformLocation(p, a.name); }
  return { p, u };
}
const paintProg = program(PAINT), finalProg = program(FINAL);
gl.bindVertexArray(gl.createVertexArray());

// ---- the pages: their photographs, and their ink ----------------------------------------------------------------
function loadImage(src) { return new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = no; im.src = src; }); }
function layers(images, w, h, premultiply) {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D_ARRAY, t);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, premultiply);
  gl.texImage3D(gl.TEXTURE_2D_ARRAY, 0, gl.RGBA8, w, h, images.length, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  images.forEach((im, i) => gl.texSubImage3D(gl.TEXTURE_2D_ARRAY, 0, 0, 0, i, w, h, 1, gl.RGBA, gl.UNSIGNED_BYTE, im));
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
  gl.generateMipmap(gl.TEXTURE_2D_ARRAY);
  gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D_ARRAY, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}

// ---- the plane in JavaScript, to name the page underfoot and to begin somewhere --------------------------------
const imul = Math.imul;
function mixh(h) { h ^= h >>> 16; h = imul(h, 0x7feb352d); h ^= h >>> 15; h = imul(h, 0x846ca68b); h ^= h >>> 16; return h >>> 0; }
function h3(x, y, s) { return mixh((imul(x | 0, 0x27d4eb2d) ^ mixh((imul(y | 0, 0x165667b1) + (s >>> 0)) >>> 0)) >>> 0); }
const unit = (h) => (h >>> 8) / 16777216;
function vnoise(x, y, g, s) {
  const fx = x / g, fy = y / g, ix = Math.floor(fx), iy = Math.floor(fy);
  let tx = fx - ix, ty = fy - iy; tx = tx * tx * (3 - 2 * tx); ty = ty * ty * (3 - 2 * ty);
  const a = unit(h3(ix, iy, s)), b = unit(h3(ix + 1, iy, s)), c = unit(h3(ix, iy + 1, s)), d = unit(h3(ix + 1, iy + 1, s));
  return (a + (b - a) * tx) + ((c + (d - c) * tx) - (a + (b - a) * tx)) * ty;
}
const G = 1597, P4 = 0.145898033750315;
function seedOf(cx, cy) {
  const h = h3(cx, cy, 53);
  return { x: (cx + 0.5 + P4 * (unit(mixh((h + 1) >>> 0)) - 0.5)) * G, y: (cy + 0.5 + P4 * (unit(mixh((h + 2) >>> 0)) - 0.5)) * G, h };
}
const pageOf = (cx, cy) => { const v = cx + 2 * cy; return v - 5 * Math.floor(v / 5); };
function regionAt(x, y) {
  const px = x + 377 * (vnoise(x, y, 987, 56) - 0.5) + 144 * (vnoise(x, y, 377, 51) - 0.5) + 34 * (vnoise(x, y, 89, 54) - 0.5);
  const py = y + 377 * (vnoise(x, y, 987, 57) - 0.5) + 144 * (vnoise(x, y, 377, 52) - 0.5) + 34 * (vnoise(x, y, 89, 55) - 0.5);
  const gx = Math.floor(px / G), gy = Math.floor(py / G);
  let best = null, bd = Infinity;
  for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
    const s = seedOf(gx + i, gy + j), dd = (px - s.x) ** 2 + (py - s.y) ** 2;
    if (dd < bd) { bd = dd; best = { x: s.x, y: s.y, h: s.h, pg: pageOf(gx + i, gy + j) }; }
  }
  return best;
}

// ---- the view ---------------------------------------------------------------------------------------------------
let W = 0, H = 0, dpr = 1, fbo = null, paintTex = null, FW = 0, FH = 0, sized = -1;
const view = { x: 0, y: 0, vx: 0, vy: 0 };
// how finely to paint: screen pixels to a paint texel (each way), and the highest pixel ratio drawn. Tier 0 always at
// rest; while the plane moves, a coarser tier if moving frames come slowly, so a drag is never left behind
const TIERS = [[2, 2], [3, 2], [3, 1.5], [4, 1]];
let tier = 0, moveTier = 0, motion = false, coasting = false, lastT = 0, lastDt = 0, evPrev = 0, evGap = 0, slow = 0, fast = 0, restTimer = 0;
/** A motion event at time t: the longest pause between them since the last frame tells a slow frame from a pause. */
function note(t) { if (evPrev) evGap = Math.max(evGap, t - evPrev); evPrev = t; motion = true; }
function size() {
  const [k, cap] = TIERS[tier];
  dpr = Math.min(window.devicePixelRatio || 1, cap);
  const cw = Math.max(1, Math.round(canvas.clientWidth * dpr)), ch = Math.max(1, Math.round(canvas.clientHeight * dpr));
  if (cw === W && ch === H && sized === tier) return;
  W = cw; H = ch; sized = tier; canvas.width = W; canvas.height = H;
  FW = Math.ceil(W / k); FH = Math.ceil(H / k);
  if (paintTex) gl.deleteTexture(paintTex);
  paintTex = gl.createTexture();
  gl.activeTexture(gl.TEXTURE2);
  gl.bindTexture(gl.TEXTURE_2D, paintTex);
  gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA8, FW, FH);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  if (!fbo) fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, paintTex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

let ready = false, queued = false;
function govern(now) {
  if (!motion) { lastT = 0; return; }
  const continuous = lastT && (coasting || evGap < 100);            // moving all the while since the last frame
  motion = coasting = false; evGap = 0;
  if (continuous) {
    const dt = lastDt = now - lastT;
    if (dt > 24) { slow++; fast = 0; } else if (dt < 17.5) { fast++; slow = Math.max(0, slow - 1); }
    if (slow >= 8 && moveTier < TIERS.length - 1) { moveTier++; slow = 0; }
    else if (fast >= 144 && moveTier > 0) { moveTier--; fast = 0; }
  }
  lastT = now;
  tier = moveTier;
  clearTimeout(restTimer);
  restTimer = setTimeout(() => { if (tier !== 0) { tier = 0; redraw(); } }, Math.max(233, 3 * lastDt));   // at rest, at its best
}
function draw(now) {
  queued = false;
  if (!ready) return;
  govern(now || performance.now());
  size();
  const ox = view.x - canvas.clientWidth / 2, oy = view.y - canvas.clientHeight / 2;
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.viewport(0, 0, FW, FH);
  gl.useProgram(paintProg.p);
  gl.uniform2f(paintProg.u.uOrigin, ox, oy);
  gl.uniform1f(paintProg.u.uCell, TIERS[tier][0] / dpr);
  gl.uniform2f(paintProg.u.uSize, FW, FH);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  gl.useProgram(finalProg.p);
  gl.uniform2f(finalProg.u.uOrigin, ox, oy);
  gl.uniform1f(finalProg.u.uDpr, dpr);
  gl.uniform2f(finalProg.u.uView, W, H);
  gl.uniform2f(finalProg.u.uPaintSize, FW, FH);
  gl.uniform2f(finalProg.u.uPaintScale, FW / W, FH / H);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  name();
}
function redraw() { if (!queued) { queued = true; requestAnimationFrame(draw); } }

// the page underfoot, named in the pages' own type
const labelEl = document.getElementById("label"), labelT = document.getElementById("label-t"), labelS = document.getElementById("label-s");
let shown = -1;
function name() {
  const pg = regionAt(view.x, view.y).pg;
  if (pg === shown) return;
  shown = pg;
  const P = ASSETS.pages[pg];
  labelT.textContent = P.title || P.label || (P.signature || "").replace(/^—/, "");
  labelS.textContent = "Picture Poetry, page " + P.n;
  labelEl.classList.remove("gone");
}

// ---- dragging, swiping, the wheel, the keys ---------------------------------------------------------------------
const still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const hint = document.getElementById("hint");
let drag = null, coast = 0;
function moved() { hint.classList.add("gone"); }
canvas.addEventListener("pointerdown", (e) => {
  canvas.setPointerCapture(e.pointerId); canvas.classList.add("held");
  drag = { x: e.clientX, y: e.clientY, t: performance.now(), vx: 0, vy: 0 };
  view.vx = view.vy = 0; cancelAnimationFrame(coast);
  evPrev = 0; evGap = 0; lastT = 0;
});
canvas.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y, now = performance.now(), dt = Math.max(1, now - drag.t);
  view.x -= dx; view.y -= dy;
  drag.vx = 0.8 * (-dx / dt) + 0.2 * drag.vx; drag.vy = 0.8 * (-dy / dt) + 0.2 * drag.vy;
  drag.x = e.clientX; drag.y = e.clientY; drag.t = now;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  for (const ce of evs.length ? evs : [e]) note(ce.timeStamp);
  moved(); redraw();
});
function release() {
  if (!drag) return;
  canvas.classList.remove("held");
  view.vx = drag.vx * 16; view.vy = drag.vy * 16; drag = null;
  if (still) return;
  let last = performance.now();
  const step = (now) => {
    const dt = Math.min(64, now - last) / 16.67; last = now;
    view.x += view.vx * dt; view.y += view.vy * dt;
    const f = Math.pow(0.94, dt); view.vx *= f; view.vy *= f;
    motion = coasting = true; redraw();
    if (Math.hypot(view.vx, view.vy) > 0.05) coast = requestAnimationFrame(step);
  };
  coast = requestAnimationFrame(step);
}
canvas.addEventListener("pointerup", release);
canvas.addEventListener("pointercancel", release);
canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  const k = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? canvas.clientHeight : 1;
  view.x += (e.shiftKey && !e.deltaX ? e.deltaY : e.deltaX) * k;
  view.y += (e.shiftKey && !e.deltaX ? 0 : e.deltaY) * k;
  note(e.timeStamp); moved(); redraw();
}, { passive: false });
canvas.addEventListener("keydown", (e) => {
  const s = e.shiftKey ? 377 : 89;
  const d = { ArrowLeft: [-s, 0], ArrowRight: [s, 0], ArrowUp: [0, -s], ArrowDown: [0, s] }[e.key];
  if (!d) return;
  e.preventDefault(); view.x += d[0]; view.y += d[1]; moved(); redraw();
});
window.addEventListener("resize", redraw);
canvas.addEventListener("webglcontextlost", (e) => {
  e.preventDefault(); ready = false;
  const f = document.getElementById("fallback");
  f.textContent = "The painting paused when the graphics card was reset. Reload the page to go on.";
  f.hidden = false;
});

// ---- begin: somewhere else each visit, in the middle of one page --------------------------------------------------
(async function begin() {
  try {
    const [photos, inks] = await Promise.all([Promise.all(ASSETS.photos.map(loadImage)), Promise.all(ASSETS.inks.map(loadImage))]);
    gl.activeTexture(gl.TEXTURE0); layers(photos, ASSETS.photoSize[0], ASSETS.photoSize[1], false);
    gl.activeTexture(gl.TEXTURE1); layers(inks, ASSETS.inkSize[0], ASSETS.inkSize[1], true);
    for (const pr of [paintProg, finalProg]) {
      gl.useProgram(pr.p);
      gl.uniform4fv(pr.u.uPageA, new Float32Array(ASSETS.pageA));
      gl.uniform4fv(pr.u.uPhotoR, new Float32Array(ASSETS.photoR));
      gl.uniform4fv(pr.u.uTextR, new Float32Array(ASSETS.textR));
    }
    gl.useProgram(paintProg.p);
    gl.uniform1i(paintProg.u.uPhoto, 0);
    gl.uniform3fv(paintProg.u.uPal, new Float32Array(ASSETS.palette));
    gl.uniform3fv(paintProg.u.uPaper, new Float32Array(ASSETS.paper));
    gl.uniform4fv(paintProg.u.uBlock, new Float32Array(ASSETS.block));
    gl.uniform3fv(paintProg.u.uBlockC, new Float32Array(ASSETS.blockC));
    gl.useProgram(finalProg.p);
    gl.uniform1i(finalProg.u.uPaint, 2);
    gl.uniform1i(finalProg.u.uInk, 1);
    const start = location.hash.match(/^#at(-?\d+)_(-?\d+)$/);
    if (start) { view.x = +start[1]; view.y = +start[2]; }
    else {
      // a page's middle; on a narrow screen, its poem's
      const cx = Math.floor((Math.random() - 0.5) * 120), cy = Math.floor((Math.random() - 0.5) * 120);
      const s = seedOf(cx, cy), pg = pageOf(cx, cy);
      view.x = s.x; view.y = s.y;
      if (canvas.clientWidth < 700) {
        const A = ASSETS.pageA, T = ASSETS.textR, k = 0.618033988749895;
        const qx = ((T[pg * 4] + T[pg * 4 + 2]) / 2 - A[pg * 4] / 2) * k, qy = ((T[pg * 4 + 1] + T[pg * 4 + 3]) / 2 - A[pg * 4 + 1] / 2) * k;
        const a = 0.0557 * (unit(mixh((s.h + 9) >>> 0)) - 0.5), c = Math.cos(a), sn = Math.sin(a);
        view.x += c * qx - sn * qy; view.y += sn * qx + c * qy;
      }
    }
    ready = true; redraw();
    setTimeout(() => hint.classList.add("gone"), 7000);
  } catch (err) {
    document.getElementById("fallback").textContent = "The pages could not be drawn: " + err.message;
    document.getElementById("fallback").hidden = false;
  }
})();
</script>
