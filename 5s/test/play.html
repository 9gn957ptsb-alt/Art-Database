<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>5s play harness</title>
<!-- A harness for src/play.js and src/board.js: the deck, an example taste (~37 kept things, brought
     things among them), and the app's part played by the callbacks below. Served from 5s/:
     /test/play.html#map | #level=7 | #board, with ?assoc=1 (sample pairings and a painting),
     ?theme=dark|light, ?reduce=1, ?plays=N (the board's seed), ?stars=3,2,1 (levels won), ?time=41,0 (wins in time),
     ?clock=0|5|10 (else as the app resolves it), ?empty=1 (nothing kept), ?deck=fixture.
     Set, inside out (FiveSPlay.mountSet, FiveSRelate.table of the same taste): ?set=1 with #level=N, or #first (the
     first board under six: ?keep=K pictures kept), ?rel=N (N relations said before, oldest first), ?words=N (N words
     of the person's own), ?boost=p,t,m (boosters held). -->
<link rel="stylesheet" href="../src/app.css">
<link rel="stylesheet" href="../src/play.css" data-fives="play">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Martian+Mono:wght@400;500&amp;family=Unbounded:wght@500;700&amp;display=swap">
<style>
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font-family: var(--font-body); }
  #stage { height: 100%; }
  .h-board { max-width: 960px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
  .h-board .actions { display: flex; flex-wrap: wrap; gap: 10px; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="../src/engine.js"></script>
<script src="../src/match.js"></script>
<script src="../src/relate.js"></script>
<script src="../src/board.js"></script>
<script src="../src/play.js"></script>
<script>
(async function () {
  'use strict';
  const q = new URLSearchParams(location.search);
  if (q.get('theme')) document.documentElement.dataset.theme = q.get('theme');
  const F = window.FiveS, M = window.FiveSMatch, P = window.FiveSPlay, B = window.FiveSBoard;
  const NOW = Date.UTC(2026, 9, 22, 12); // fixed, so a test in Node builds the same taste and boards
  let base = q.get('deck') === 'fixture' ? 'fixture/' : '../dist/';
  let deck;
  try { deck = await (await fetch(base + 'deck.json')).json(); }
  catch (e) { base = 'fixture/'; deck = await (await fetch(base + 'deck.json')).json(); }
  const byId = new Map(deck.cards.map((c) => [c.id, c]));

  let state = q.get('empty') ? F.newState() : F.exampleState(deck, NOW);
  const won = q.get('stars') ? q.get('stars').split(',').map(Number) : [];
  const time = q.get('time') ? q.get('time').split(',').map(Number) : [];
  state = Object.assign({}, state, { assoc: [], paintings: [], saga: { stars: won, best: won.map((s) => s * 3000), boost: { pass: 1, turn: 1, more: 1 }, plays: +(q.get('plays') || 0), day: null, time, built: [] } });
  if (q.get('assoc')) {
    // Pairings as if three levels had been played: groups of kept things that share a thread.
    const pcs = M.pieces(state, deck, 5);
    let assoc = [];
    pcs.suits.forEach((s, i) => {
      if (s.ids.length < 3) return;
      for (let k = 0; k < 3 + i; k++) assoc = M.addAssociations(assoc, [s.ids[k % s.ids.length], s.ids[(k + 1) % s.ids.length], s.ids[(k + 2) % s.ids.length]], NOW / 1000 - k * 60);
    });
    if (pcs.suits[0] && pcs.suits[0].ids.length > 1) assoc = M.heart(assoc, pcs.suits[0].ids.slice(0, 2), true);
    const cols = 7, rows = 7;
    let c = '';
    for (let i = 0; i < cols * rows; i++) c += ['f28a3c', 'e5482b', '7350ee', '2f6be0', 'ece5d1'][(i * 7 + (i >> 3)) % 5];
    state.assoc = assoc;
    state.paintings = [{ at: NOW / 1000 - 3600, n: 7, cols, rows, c }];
  }

  const own = (id) => (state.own || []).find((o) => o.id === id);
  function thumb(id) {
    const o = own(id);
    const c = byId.get(o ? o.imgFrom : id);
    if (!c) return { colours: (o && o.colours) || [] };
    if (c.kind === 'colour') return { colours: c.colours };
    if (deck.atlas && Number.isFinite(c.thumb)) return { src: base + deck.atlas.src, cols: deck.atlas.cols, index: c.thumb };
    return c.img ? { src: base + c.img } : { colours: c.colours };
  }
  function shortName(id) {
    const c = F.card(state, deck, id);
    if (!c) return 'Something';
    const t = String(c.title || 'Untitled').replace(/\s+/g, ' ').trim();
    return t.length > 28 ? t.slice(0, 27).replace(/[\s,.;:]+$/, '') + '…' : t;
  }
  const nameLine = (c) => (c.own ? c.title + ', from ' + c.source : [c.title, c.artist, c.date].filter(Boolean).join(', '));
  function image(c) {
    if (c.own) { const d = byId.get(c.imgFrom); return d && d.img ? base + d.img : null; }
    return c.img ? base + c.img : null;
  }

  const calls = [];
  const log = (k, v) => { calls.push([k, v]); };
  const stage = document.getElementById('stage');
  let current = null;
  const clear = () => { if (current) current.destroy(); current = null; stage.textContent = ''; };
  const reduce = q.get('reduce') ? true : undefined;

  function showBoard() {
    clear();
    const wrap = document.createElement('div');
    wrap.className = 'h-board';
    const next = state.saga.stars.length + 1;
    wrap.innerHTML = '<div class="view-head"><h1 class="h1">Set</h1><p class="lede">Your board: what you kept, grouped by what you put together.</p>' +
      '<div class="actions"><button type="button" class="btn btn-keep btn-big" id="h-play">Play level ' + next + '</button><button type="button" class="btn btn-quiet" id="h-room">See it as a room</button></div></div>';
    const host = document.createElement('div');
    wrap.appendChild(host);
    stage.appendChild(wrap);
    wrap.querySelector('#h-play').addEventListener('click', () => { location.hash = 'map'; });
    wrap.querySelector('#h-room').addEventListener('click', () => log('room', true));
    const b = B.mount(host, { state, deck, image, name: nameLine, onOpen: (id) => log('open', id), onPainting: (i) => log('painting', i) });
    current = { destroy: () => { b.destroy(); wrap.remove(); } };
  }
  function showMap() {
    clear();
    current = P.mountMap(stage, { saga: state.saga, onLevel: (n) => { location.hash = 'level=' + n; }, onBack: () => { location.hash = 'board'; }, onKingdom: () => log('kingdom', true) });
  }
  function showLevel(n) {
    clear();
    const level = M.level(n);
    const pieces = M.pieces(state, deck, level.suits);
    const seed = '5s:' + n + ':' + state.saga.plays;
    window.harness.level = { n, pieces, seed };
    const sg = state.saga, built = sg.built[n - 1];
    current = P.mount(stage, {
      n, pieces, seed,
      clock: q.get('clock') != null ? +q.get('clock') : state.opts.clock ?? (state.opts.ring !== false ? 5 : 0), // as the app resolves it
      built: sg.stars[n - 1] ? { name: built ? shortName(built) : null, storeys: sg.stars[n - 1], secs: sg.time[n - 1] || 0 } : null,
      boost: state.saga.boost,
      thumb, name: shortName,
      opts: { sound: state.opts.sound !== false, hints: state.opts.hints !== false, reduce },
      onAssociate: (a) => { log('associate', a); state.assoc = M.addAssociations(state.assoc, a.ids, NOW / 1000); },
      onHeart: (a) => { log('heart', a); state.assoc = M.heart(state.assoc, a.ids, a.on); },
      onBoost: (k) => { log('boost', k); state.saga = M.useBoost(state.saga, k) || state.saga; },
      onEnd: (r) => { // as the app: record, then build with the first of the ways
        log('end', r);
        const rec = M.recordLevel(state.saga, r, NOW / 1000);
        if (!r.won) { state.saga = rec.saga; return rec; }
        const ways = M.buildChoices(state, deck, r, state.saga.built[n - 1]);
        state.saga = M.build(rec.saga, n, ways[0] ?? null);
        return Object.assign({}, rec, { saga: state.saga, build: { ways } });
      },
      onBuild: (id) => { log('build', id); state.saga = M.build(state.saga, n, id); },
      onKingdom: (k) => log('kingdom', k),
      onKeepPainting: (p) => { log('keepPainting', p); const ps = M.keepPainting(state.paintings, { painting: p, n }, NOW / 1000); if (!ps) return false; state.paintings = ps; return true; },
      onOpts: (o) => { log('opts', o); state.opts = Object.assign({}, state.opts, o); },
      onNext: (k) => { log('next', k); location.hash = 'level=' + k + '&t=' + Date.now(); },
      onMap: () => { log('map', true); location.hash = 'map'; },
      onBoard: () => { log('board', true); location.hash = 'board'; },
    });
  }
  // ---------------------------------------------------------------- Set, inside out: the app's part (SPEC-set-inside-out §10.5)
  const RL = window.FiveSRelate;
  if (q.get('set')) {
    if (q.get('keep') != null) {   // the first board: only the first K kept pictures stay kept, nothing brought
      let k = +q.get('keep');
      const pics = new Set(deck.cards.filter((c) => c.img && c.kind !== 'colour').map((c) => c.id));
      state = Object.assign({}, state, { own: [], j: state.j.filter((e) => !(e[1] && pics.has(e[0])) || k-- > 0) });
    }
    if (q.get('words')) state.saga.words = Array.from({ length: +q.get('words') }, (_, i) => 'word ' + (i + 1));
    if (q.get('boost')) { const b = q.get('boost').split(',').map(Number); state.saga.boost = { pass: b[0] | 0, turn: b[1] | 0, more: b[2] | 0 }; }
    const T0 = RL.table(state, deck, ownPics());
    for (let i = 0; i < +(q.get('rel') || 0) && i + 1 < T0.pool.length; i++) state.assoc = RL.relate(state.assoc, T0.pool[i], T0.pool[i + 1], i % 2 ? -1 : 1, (i % 5) + 1, NOW / 1000 - 9000 + i * 60);
  }
  function ownPics() { return (state.own || []).filter((o) => o && o.let == null && byId.get(o.imgFrom) && byId.get(o.imgFrom).img).map((o) => o.id); }
  function setPic(id) {
    const o = own(id), c = byId.get(o ? o.imgFrom : id);
    return c && c.img ? { src: base + c.img, w: c.w, h: c.h } : { colours: (c && c.colours) || (o && o.colours) || [] };
  }
  function setBy(id) { const c = F.card(state, deck, id); return c && !c.own ? c.artist || null : 'Brought in by you'; }
  let relAt = NOW / 1000;
  function setCallbacks(n, table) {
    return {
      pic: setPic, name: shortName, by: setBy, kind: (id) => (F.card(state, deck, id) || {}).kind || null, aspectOf: deck.words || {},
      boost: state.saga.boost, clock: q.get('clock') != null ? +q.get('clock') : state.opts.clock ?? (state.opts.ring !== false ? 5 : 0),
      opts: { sound: state.opts.sound !== false, hints: state.opts.hints !== false, reduce },
      onRelate: (r) => { log('relate', r); state.assoc = RL.relate(state.assoc, r.x, r.y, r.s, r.w, ++relAt); },
      onWord: (text) => { log('word', text); const a = RL.addWord(state.saga.words, text); if (a.w == null) return null; state.saga = Object.assign({}, state.saga, { words: a.words }); table.vocab = a.words; return a.w; },
      onHeart: (a) => { log('heart', a); state.assoc = M.heart(state.assoc, a.ids, a.on); },
      onNote: (a) => log('note', a),
      onBoost: (k) => { log('boost', k); state.saga = M.useBoost(state.saga, k) || state.saga; },
      onEnd: (r) => {   // as the app (engine-api.md, EndInfo)
        log('end', r);
        const rec = M.recordLevel(state.saga, r);
        if (!r.won) { state.saga = rec.saga; return rec; }
        if (n > rec.saga.stars.length) { state.saga = rec.saga; return null; }
        const ways = RL.ways(state, deck, r, state.saga.built[n - 1]);
        state.saga = M.build(rec.saga, n, ways[0] ?? null);
        const info = Object.assign({}, rec, { saga: state.saga, build: { ways, storeys: ways.map((id) => RL.storeys(state, n, id)) },
          ask: RL.ask(state, deck).length > 0, sortAFive: RL.unsetShare(RL.table(state, deck, ownPics())) < 0.5 });
        log('endInfo', info);
        return info;
      },
      onBuild: (id) => { log('build', id); state.saga = M.build(state.saga, n, id); },
      onKingdom: (k) => log('kingdom', k),
      onOpts: (o) => { log('opts', o); state.opts = Object.assign({}, state.opts, o); },
      onNext: (k) => { log('next', k); location.hash = 'level=' + k + '&t=' + Date.now(); },
      onMap: () => { log('map', true); location.hash = 'map'; },
      onBoard: () => { log('board', true); location.hash = 'board'; },
      onSort: () => log('sort', true),
    };
  }
  function showSet(n) {
    clear();
    const table = RL.table(state, deck, ownPics());
    const seed = '5s:' + n + ':' + (state.saga.plays || 0), lead = (RL.leads(table, n)[0] || {}).id;
    const sg = state.saga, built = sg.built[n - 1];
    window.harness.level = { n, table: JSON.parse(JSON.stringify(table)), seed, lead };
    current = P.mountSet(stage, Object.assign(setCallbacks(n, table), { n, table, seed, lead,
      built: sg.stars[n - 1] ? { name: built ? shortName(built) : null, storeys: RL.storeys(state, n), secs: (sg.time || [])[n - 1] || 0 } : null }));
  }
  function showFirst() {   // Set's view under six: the first board above the mood board, as the app shows it
    clear();
    const wrap = document.createElement('div');
    wrap.className = 'h-board';
    wrap.innerHTML = '<div class="view-head"><h1 class="h1">Set</h1></div><div class="set-first"></div>';
    stage.appendChild(wrap);
    const table = RL.table(state, deck, ownPics());
    window.harness.level = { n: 1, table: JSON.parse(JSON.stringify(table)), free: true };
    const v = P.mountSet(wrap.querySelector('.set-first'), Object.assign(setCallbacks(1, table), { n: state.saga.stars.length + 1, table, free: true }));
    current = { destroy: () => { v.destroy(); wrap.remove(); } };
  }
  function route() {
    const h = location.hash.slice(1);
    const m = /^level=(\d+)/.exec(h);
    if (m && q.get('set')) showSet(+m[1]);
    else if (h === 'first') showFirst();
    else if (m) showLevel(+m[1]); else if (h === 'map') showMap(); else showBoard();
  }
  window.harness = { deck, get state() { return state; }, calls, NOW, route, name: shortName };
  window.addEventListener('hashchange', route);
  route();
  window.harness.ready = true;
})().catch((e) => { document.body.textContent = 'Harness failed: ' + e.message; window.harnessError = String(e && e.stack || e); });
</script>
</body>
</html>
