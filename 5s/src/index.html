<title>5s</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="app.css" data-inline>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;family=Martian+Mono:wght@400;500&amp;family=Unbounded:wght@500;700&amp;display=swap">

<svg class="defs" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="ring-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color:var(--ember-mark)"/>
      <stop offset="0.55" style="stop-color:var(--flare)"/>
      <stop offset="1" style="stop-color:var(--iris)"/>
    </linearGradient>
    <symbol id="i-sort" viewBox="0 0 24 24"><rect x="5.5" y="3.5" width="13" height="15" rx="3.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8 21h8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-split" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7.5" height="7.5" rx="1.8" fill="currentColor"/><rect x="13" y="3.5" width="7.5" height="7.5" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="3.5" y="13" width="7.5" height="7.5" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="13" y="13" width="7.5" height="7.5" rx="3.75" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
    <symbol id="i-set" viewBox="0 0 24 24"><path d="M3.5 4.5h17v15h-17z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M3.5 15h17" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="6" y="7" width="5" height="5" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="14" y="8" width="4" height="3.4" fill="currentColor"/></symbol>
    <symbol id="i-see" viewBox="0 0 24 24"><circle cx="8.5" cy="12" r="5" fill="currentColor"/><circle cx="15.5" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
    <symbol id="i-seed" viewBox="0 0 24 24"><path d="M12 6.5l8.2 4.7L12 16 3.8 11.2z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M3.8 11.2v3.1L12 19l8.2-4.7v-3.1" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M12 11.3V3.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M12 6c1.4-1.9 3-2.4 4.4-2.1-.3 1.6-1.9 2.6-4.4 2.1z" fill="currentColor"/></symbol>
    <symbol id="i-keep" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="currentColor"/><path d="M8.2 12.3l2.6 2.6 5-5.4" fill="none" style="stroke:var(--glyph-on)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-pass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.8" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="i-letgo" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.8" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3 3"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="M19 12H5m5.5-5.5L5 12l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="M5 12h14m-5.5-5.5L19 12l-5.5 5.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 7L4.5 11.5 9 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 11.5h9a5.5 5.5 0 010 11h-2" transform="translate(0 -3)" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-closer" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15 15l5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-turn" viewBox="0 0 24 24"><path d="M4 17c4.5 0 5-10 9.5-10S18 13 20 13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M17 10l3 3-3 3" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-out" viewBox="0 0 24 24"><path d="M14 5h5v5M19 5l-8 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 14v4a1 1 0 01-1 1H6a1 1 0 01-1-1V8a1 1 0 011-1h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10.5 13.5a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1.2 1.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M13.5 10.5a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1.2-1.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-signin" viewBox="0 0 24 24"><circle cx="8" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 12h8.5M17.5 12v3M20.5 12v2.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3.5h8l4 4V20a.5.5 0 01-.5.5h-11A.5.5 0 016 20z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 3.5V8h4M9 12.5h6M9 16h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="9" cy="10" r="1.8" fill="currentColor"/><path d="M4 17.5l5-4.5 3.5 3 3-2.5 4.5 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M4.5 6.5a2 2 0 012-2h11a2 2 0 012 2v8a2 2 0 01-2 2H11l-4.5 3.5v-3.5h0a2 2 0 01-2-2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M8.5 9.5h7M8.5 12.5h4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-streak" viewBox="0 0 24 24"><path d="M5 18l4-5 3 3 6-8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<div class="app" id="app">
  <header class="bar">
    <a class="brand" href="#sort" id="brand" aria-label="5s, go to Sort">
      <img class="brand-logo" id="brand-logo" src="logo.webp" alt="" width="34" height="34" decoding="async">
      <span class="brand-mark" id="brand-mark" hidden aria-hidden="true">5s</span>
    </a>
    <p class="bar-step" id="bar-step" aria-hidden="true"></p>
    <button type="button" class="pathchip" id="pathchip" data-act="path" aria-haspopup="dialog">Path <span class="mono" id="path-n">0/12</span></button>
  </header>
  <div class="exbanner" id="exbanner" hidden>
    <p><strong>Example taste.</strong> Not yours.</p>
    <button type="button" class="btn btn-quiet" data-act="example-off">Back to mine</button>
  </div>
  <main class="main" id="main">
    <section class="view view-sort" id="view-sort" role="tabpanel" aria-labelledby="tab-sort" tabindex="-1"></section>
    <section class="view" id="view-split" role="tabpanel" aria-labelledby="tab-split" tabindex="-1" hidden></section>
    <section class="view" id="view-set" role="tabpanel" aria-labelledby="tab-set" tabindex="-1" hidden></section>
    <section class="view" id="view-see" role="tabpanel" aria-labelledby="tab-see" tabindex="-1" hidden></section>
    <section class="view" id="view-seed" role="tabpanel" aria-labelledby="tab-seed" tabindex="-1" hidden></section>
  </main>
  <p class="savenote" id="savenote" hidden></p>
  <div class="tabs-spacer" aria-hidden="true"></div>
</div>

<nav class="tabs" aria-label="Steps">
  <div class="tablist" role="tablist" aria-label="The five steps">
    <button type="button" class="tab" role="tab" id="tab-sort" aria-controls="view-sort" aria-selected="true" tabindex="0" data-view="sort"><svg class="tab-ic" aria-hidden="true"><use href="#i-sort"/></svg><span>Sort</span></button>
    <button type="button" class="tab" role="tab" id="tab-split" aria-controls="view-split" aria-selected="false" tabindex="-1" data-view="split"><svg class="tab-ic" aria-hidden="true"><use href="#i-split"/></svg><span>Split</span></button>
    <button type="button" class="tab" role="tab" id="tab-set" aria-controls="view-set" aria-selected="false" tabindex="-1" data-view="set"><svg class="tab-ic" aria-hidden="true"><use href="#i-set"/></svg><span>Set</span></button>
    <button type="button" class="tab" role="tab" id="tab-see" aria-controls="view-see" aria-selected="false" tabindex="-1" data-view="see"><svg class="tab-ic" aria-hidden="true"><use href="#i-see"/></svg><span>See</span></button>
    <button type="button" class="tab" role="tab" id="tab-seed" aria-controls="view-seed" aria-selected="false" tabindex="-1" data-view="seed"><svg class="tab-ic" aria-hidden="true"><use href="#i-seed"/></svg><span>Seed</span></button>
  </div>
</nav>

<dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
  <div class="sheet-inner">
    <div class="sheet-head">
      <h2 class="sheet-title" id="sheet-title">5s</h2>
      <button type="button" class="iconbtn" data-act="close-sheet" aria-label="Close"><svg aria-hidden="true"><use href="#i-close"/></svg></button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</dialog>

<div class="fly-layer" id="fly-layer" aria-hidden="true"></div>
<div class="visually-hidden" id="live" role="status" aria-live="polite" aria-atomic="true"></div>

<script src="engine.js"></script>
<script src="bring.js"></script>
<script src="ground.js"></script>
<script src="hub.js"></script>
<script src="hubpage.js"></script>
<script src="connect.js"></script>
<script src="app.js"></script>
